<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scam Shield — WhatsApp/SMS Scam Detector</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen">
<div class="max-w-3xl mx-auto p-4">
  <header class="py-6 text-center">
    <h1 class="text-3xl font-bold">🛡️ Scam Shield</h1>
    <p class="text-slate-600">Paste any SMS / WhatsApp message → Safe / Suspicious / Scam + reason in your language</p>
    <p id="sched" class="text-xs text-slate-500 mt-1">scheduler: checking…</p>
  </header>

  <div class="bg-white rounded-2xl shadow p-4 space-y-3">
    <div class="flex gap-2">
      <select id="lang" class="border rounded px-2 py-2">
        <option value="auto">Auto (EN/HI/MR)</option>
        <option value="en">English</option><option value="hi">हिंदी</option><option value="mr">मराठी</option>
      </select>
      <button onclick="speak()" class="border rounded px-3">🔊 Speak</button>
    </div>
    <textarea id="msg" rows="4" class="w-full border rounded p-3" placeholder="e.g. Dear customer your SBI KYC expired urgently verify at http://sbi-kyc-update.xyz within 24 hours"></textarea>
    <div class="flex gap-2">
      <button onclick="check()" class="bg-black text-white rounded px-5 py-2">Check</button>
      <label class="border rounded px-3 py-2 cursor-pointer">📷 Screenshot<input id="img" type="file" accept="image/*" class="hidden" onchange="checkImage()"></label>
      <button onclick="loadTrends()" class="border rounded px-3 py-2">📊 Trends</button>
    </div>
    <div class="flex gap-2 text-sm">
      <button class="border rounded px-2 py-1" onclick="fill('Dear customer your SBI KYC expired urgently verify at http://sbi-kyc-update.xyz')">KYC scam</button>
      <button class="border rounded px-2 py-1" onclick="fill('बधाई हो! आपने 25000 की लॉटरी जीती है http://inam-claim.top पर Rs 99 फीस देकर पाएं')">Lottery HI</button>
      <button class="border rounded px-2 py-1" onclick="fill('Meeting at 5pm tomorrow bring the report thanks')">Safe</button>
    </div>
  </div>

  <div id="out" class="mt-4"></div>
  <div id="trends" class="mt-4 bg-white rounded-2xl shadow p-4 hidden"></div>

  <div class="mt-4 bg-yellow-50 border rounded-2xl p-4 text-sm">
    <b>⚠️ If Scam:</b> Don't click / reply / pay. Call <b>1930</b>, report at <b>cybercrime.gov.in</b>.
  </div>
</div>
<script>
const API = "http://127.0.0.1:8000";
function fill(t){ document.getElementById('msg').value = t; }
function verdictColor(v){ return v==='Scam'?'bg-red-600':v==='Suspicious'?'bg-orange-500':'bg-green-600'; }
async function check(){
  const message = document.getElementById('msg').value;
  let lang = document.getElementById('lang').value; if(lang==='auto') lang=null;
  const r = await fetch(API+'/check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message, lang})});
  render(await r.json());
}
async function checkImage(){
  const f = document.getElementById('img').files[0]; if(!f) return;
  const fd = new FormData(); fd.append('file', f);
  const r = await fetch(API+'/check-image',{method:'POST',body:fd});
  const j = await r.json(); if(j.ocr_text) document.getElementById('msg').value = j.ocr_text;
  render(j);
}
function render(j){
  if(j.error){ document.getElementById('out').innerHTML = `<div class="bg-white p-4 rounded shadow">${j.error}</div>`; return; }
  window._lastExplain = j.explanation;
  document.getElementById('out').innerHTML = `
  <div class="bg-white rounded-2xl shadow p-4">
    <div class="flex items-center gap-3">
      <span class="text-white px-3 py-1 rounded-full ${verdictColor(j.verdict)}">${j.verdict} • ${(j.score*100).toFixed(0)}%</span>
      <span class="text-sm text-slate-600">${j.category} • ${j.lang}</span>
    </div>
    <p class="mt-3">${j.explanation}</p>
    <p class="mt-2 text-sm"><b>Red flags:</b> ${(j.signals||[]).join(' | ')||'none'}</p>
    <p class="mt-1 text-sm"><b>Links:</b> ${(j.urls||[]).join(', ')||'none'} | <b>Highlights:</b> ${(j.highlights||[]).join(', ')||'—'}</p>
    <p class="mt-1 text-xs text-slate-500">Privacy: ${j.masked_preview}</p>
  </div>`;
}
function speak(){
  if(!window._lastExplain) return alert('Check a message first');
  const u = new SpeechSynthesisUtterance(window._lastExplain);
  const lang = document.getElementById('lang').value;
  u.lang = lang==='hi'?'hi-IN':lang==='mr'?'mr-IN':'en-IN';
  speechSynthesis.speak(u);
}
async function loadTrends(){
  const r = await fetch(API+'/trends'); const j = await r.json();
  const d = document.getElementById('trends'); d.classList.remove('hidden');
  d.innerHTML = '<b>📊 Trending scams (anonymized, auto-updated hourly by scheduler)</b><pre class="text-xs mt-2">'+JSON.stringify(j,null,2)+'</pre>';
}
fetch(API+'/scheduler-status').then(r=>r.json()).then(j=>{
  document.getElementById('sched').innerText = j.running ? 'scheduler: running ✅ '+ j.jobs.map(x=>x.id).join(', ') : 'scheduler: offline (start backend)';
}).catch(()=>{ document.getElementById('sched').innerText='scheduler: backend not running — run uvicorn'; });
</script>
</body>
</html>
