services:
  api:
    build: .
    ports:
      - "8001:8000"
    environment:
      SCAMSHIELD_DB: /data/scamshield.db
    volumes:
      - scamshield-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/scheduler-status', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3

volumes:
  scamshield-data:
